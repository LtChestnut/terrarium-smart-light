; Terrarium Smart Light firmware: Seeed XIAO ESP32-C6 (primary) / ESP32-S3.
;
; Uses the pioarduino platform (Arduino-ESP32 3.x), the same release as the tapo_light_display
; knob project: the C6 needs Arduino 3.x, which the official espressif32 platform doesn't ship.
; This release has no seeed_xiao_esp32c6 board file, so the C6 env uses the C6 DevKit board
; with Seeed's XIAO_ESP32C6 variant (pin names, RF-switch init) and the XIAO's 4 MB flash.

[platformio]
default_envs = xiao_esp32c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
extra_scripts =
    pre:scripts/short_includes.py   ; Windows: keep the C6 assembler command under 32 KB
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

[env:xiao_esp32c6]
board = esp32-c6-devkitc-1
board_build.variant = XIAO_ESP32C6
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv   ; 2 x 1.25 MB app (OTA-capable) + SPIFFS

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
board_build.partitions = default_8MB.csv
